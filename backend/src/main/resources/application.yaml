spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stock_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    # Flyway est la source de vérité du schéma : Hibernate ne fait que
    # VALIDER (aucune création/modification). Toute évolution de schéma
    # passe désormais par une migration db/migration/V*__*.sql.
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Flyway : source de vérité du schéma (V1 baseline + V2+ évolutives).
  # * Bases EXISTANTES créées par ddl-auto: update : au premier démarrage,
  #   baseline-on-migrate pose le marqueur "V1 appliquée" (baseline-version:
  #   1) puis n'exécute que V2 et suivantes — V1 n'est PAS rejetée dessus.
  # * Bases NEUVES (schéma vide) : V1, V2, V3 sont exécutées normalement.
  # Sert aussi de filet pour les migrations de données/confort (ex: V3
  # élargit article.photo AVANT la validation Hibernate de ddl-auto).
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT Configuration
# ⚠️ Le défaut ci-dessous est réservé au DÉVELOPPEMENT local (il évite de
# configurer une variable d'environnement à chaque checkout). Il est VOLONTAIREMENT
# public (l'historique git l'a toujours contenu) : tous les tokens signés avec
# doivent être considérés comme non fiables. En production, le profil "prod"
# l'interdit : voir application-prod.yaml (JWT_SECRET obligatoire, sans défaut).
# Générer un vrai secret : openssl rand -base64 64
jwt:
  secret: ${JWT_SECRET:c2dzLXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9uLTIwMjYtc3VwZXItc2VjdXJl}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 heures en millisecondes
  # Durée de vie du refresh token (§6.3) : fenêtre de reconnexion
  # silencieuse. À l'expiration, l'utilisateur repasse par /login.
  refresh-expiration-days: ${JWT_REFRESH_DAYS:7}

server:
  port: 8081

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html